name: Rust foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Install desktop build libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev xvfb xauth libdbus-1-dev zenity
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Debug tests
        run: cargo test --workspace --all-features --locked --offline
      - name: Release tests
        run: cargo test --workspace --all-features --release --locked --offline
      - name: Million-operation tree campaign
        env:
          KEDR_TREE_SEEDS: 100
          KEDR_TREE_STEPS: 10000
        run: cargo test -p kedr-testkit --test tree_contract --release --locked --offline seeded_tree_operations_match_independent_map -- --exact --nocapture
      - name: Build CLI
        run: cargo build --workspace --release --locked --offline
      - name: Ten-thousand-point crash campaign
        env:
          KEDR_CRASH_CASES: 10000
        run: cargo test -p kedr-testkit --test crash_campaign --release --locked --offline -- --nocapture
      - name: File I/O smoke check
        run: target/release/kedr doctor && target/release/kedr storage-check "$RUNNER_TEMP"
      - name: Install PostgreSQL SQL oracle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 python3-psycopg
      - name: SQL differential campaign (Linux)
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 tools/check_stage5_sql.py --pg-bin /usr/lib/postgresql/16/bin --manual 1025 --generated 100000 --output "$RUNNER_TEMP/stage5-sql-oracle"
          cat "$RUNNER_TEMP/stage5-sql-oracle/summary.json"
  studio-integration:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Install native/client test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev xvfb xauth libdbus-1-dev zenity fonts-dejavu-core postgresql-16 python3-psycopg python3-pil
      - name: Build actual server and Studio
        run: cargo build --workspace --features kedr-studio/screenshot --locked
      - name: Native Studio and client acceptance
        run: |
          /usr/bin/python3 tools/check_stage6_clients.py --psql /usr/lib/postgresql/16/bin/psql --output "$RUNNER_TEMP/stage6-clients" --studio
          cat "$RUNNER_TEMP/stage6-clients/summary.json"
      - name: Save native acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage6-linux-studio
          path: ${{ runner.temp }}/stage6-clients
          retention-days: 7

  maintenance:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Install migration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 python3-psycopg
      - name: Build maintenance CLI
        run: cargo build -p kedr --release --locked
      - name: PostgreSQL migration and maintenance acceptance (Linux)
        run: /usr/bin/python3 tools/check_stage7_maintenance.py --pg-bin /usr/lib/postgresql/16/bin --kedr target/release/kedr --output "$RUNNER_TEMP/stage7-maintenance"
      - name: Save portable backup (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: stage7-linux-maintenance
          path: ${{ runner.temp }}/stage7-maintenance
          # .identity belongs to this synthetic backup; no credentials are exported.
          include-hidden-files: true
          retention-days: 7

  portable-restore:
    timeout-minutes: 15
    needs: maintenance
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: actions/download-artifact@v4
        with:
          name: stage7-linux-maintenance
          path: ${{ runner.temp }}/stage7-linux-maintenance
      - name: Build maintenance CLI
        run: cargo build -p kedr --release --locked
      - name: Restore Linux checkpoint on independent macOS machine
        run: |
          target/release/kedr verify-backup "$RUNNER_TEMP/stage7-linux-maintenance/portable-backup"
          target/release/kedr restore "$RUNNER_TEMP/stage7-linux-maintenance/portable-backup" "$RUNNER_TEMP/restored-linux"
          target/release/kedr integrity-check "$RUNNER_TEMP/restored-linux"
          target/release/kedr export-sql "$RUNNER_TEMP/restored-linux" "$RUNNER_TEMP/restored-linux.sql"
          cmp "$RUNNER_TEMP/restored-linux.sql" "$RUNNER_TEMP/stage7-linux-maintenance/portable.sql"
