# SPDX-License-Identifier: Apache-2.0
[package]
name = "kedr-studio"
description = "Kedr Studio native administration application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
screenshot = ["dep:image"]

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "time", "macros", "net"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
zeroize = "1"
futures-util = "0.3"
rfd = "=0.17.2"

[dev-dependencies]
kedr-server = { path = "../kedr-server" }
kedr-core = { path = "../kedr-core" }

[lints]
workspace = true
